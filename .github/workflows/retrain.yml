name: Controlled retraining
# Manual or scheduled drift CHECK; retraining itself is manual (workflow_dispatch) and the result is
# uploaded as an artifact for human review - nothing is auto-deployed.
on:
  workflow_dispatch:
    inputs: { reason: { description: "Why retrain?", required: true } }
env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}        # e.g. DagsHub MLflow URI
  MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt && python -c "import nltk; nltk.download('vader_lexicon')"
      - run: python -m src.models.train
      - run: python -m src.evaluation.robustness
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with: { name: candidate-model, path: "models/\nreports/" }
